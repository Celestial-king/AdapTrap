<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdapTrap Dashboard{% block title_suffix %}{% endblock %}</title>
    <style>
        /* ── Reset ────────────────────────────────────────────────────── */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        /* ── Design tokens: black/yellow theme ────────────────────────── */
        :root {
            --bg-page:        #0a0a0a;
            --bg-card:        #111111;
            --bg-card-grad:   linear-gradient(135deg, #141414 0%, #0e0e0e 100%);
            --bg-header:      linear-gradient(135deg, #111111 0%, #0d0d0d 100%);
            --border:         #222222;
            --border-accent:  #f5a623;

            /* yellow accent palette */
            --yellow-bright:  #f5c518;   /* IMDB-style gold — active tab, key CTAs */
            --yellow-main:    #f5a623;   /* card h2 underline, badges */
            --yellow-dim:     #b87a10;   /* hover states */
            --yellow-glow:    rgba(245,166,35,0.25);

            /* status colours (kept from existing design) */
            --red:    #ef4444;
            --amber:  #f59e0b;
            --green:  #10b981;

            /* text */
            --text-primary:   #f0f0f0;
            --text-secondary: #a0a0a0;
            --text-muted:     #555555;

            --radius-card:  16px;
            --radius-btn:   10px;
            --radius-badge: 12px;

            --shadow-card: 0 8px 32px rgba(0,0,0,0.6);
            --shadow-btn:  0 4px 14px rgba(245,166,35,0.35);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
            background: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* ── Page wrapper ─────────────────────────────────────────────── */
        .page-wrap {
            max-width: 1600px;
            margin: 0 auto;
            padding: 24px 20px 40px;
        }

        /* ── Header ───────────────────────────────────────────────────── */
        .header {
            background: var(--bg-header);
            padding: 32px 40px;
            border-radius: var(--radius-card);
            border: 1px solid var(--border);
            margin-bottom: 0;         /* tabs sit flush below */
            box-shadow: var(--shadow-card);
            display: flex;
            align-items: center;
            gap: 28px;
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
            border-bottom: none;
        }

        .logo-container img {
            height: 88px;
            width: auto;
            filter: drop-shadow(0 4px 12px rgba(245,166,35,0.25));
        }

        .header-content { flex: 1; }

        .header h1 {
            color: var(--text-primary);
            font-size: 2.5em;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .header h1 .brand { color: var(--yellow-main); }

        .header p {
            color: var(--text-secondary);
            font-size: 1em;
            line-height: 1.6;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.78em;
            font-weight: 700;
            margin-left: 14px;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            vertical-align: middle;
        }

        .status-active {
            background: linear-gradient(135deg, var(--green) 0%, #059669 100%);
            color: #fff;
            box-shadow: 0 3px 10px rgba(16,185,129,0.3);
        }

        .timestamp {
            color: var(--text-muted);
            font-size: 0.82em;
            margin-top: 10px;
        }

        /* ── Tab nav ──────────────────────────────────────────────────── */
        .tab-nav {
            display: flex;
            background: #0d0d0d;
            border: 1px solid var(--border);
            border-top: none;
            border-bottom-left-radius: var(--radius-card);
            border-bottom-right-radius: var(--radius-card);
            margin-bottom: 28px;
            overflow: hidden;
        }

        .tab-nav a {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 16px 24px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95em;
            font-weight: 600;
            letter-spacing: 0.3px;
            border-bottom: 3px solid transparent;
            transition: color 0.18s, border-color 0.18s, background 0.18s;
        }

        .tab-nav a:hover {
            color: var(--yellow-main);
            background: rgba(245,166,35,0.05);
        }

        .tab-nav a.active {
            color: var(--yellow-bright);
            border-bottom-color: var(--yellow-bright);
            background: rgba(245,197,24,0.07);
        }

        .tab-nav .tab-icon { font-size: 1.1em; }

        /* ── Cards ────────────────────────────────────────────────────── */
        .card {
            background: var(--bg-card-grad);
            padding: 28px;
            border-radius: var(--radius-card);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-card);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 48px rgba(0,0,0,0.7);
        }

        .card h2 {
            color: var(--text-primary);
            font-size: 1.3em;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--yellow-main);
            padding-bottom: 12px;
            font-weight: 600;
        }

        /* ── Grid layouts ─────────────────────────────────────────────── */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 22px;
            margin-bottom: 24px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        /* ── Metrics ──────────────────────────────────────────────────── */
        .metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 13px 0;
            border-bottom: 1px solid var(--border);
        }

        .metric:last-child { border-bottom: none; }

        .metric-label {
            color: var(--text-secondary);
            font-size: 0.92em;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .metric-value {
            color: var(--text-primary);
            font-size: 1.75em;
            font-weight: 700;
        }

        .metric-value.highlight {
            background: linear-gradient(135deg, var(--yellow-main) 0%, var(--yellow-bright) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ── Score colours (tier coding) ──────────────────────────────── */
        .score-high   { color: var(--red);   font-weight: 700; }
        .score-medium { color: var(--amber);  font-weight: 700; }
        .score-low    { color: var(--green);  font-weight: 700; }

        /* ── Tables ───────────────────────────────────────────────────── */
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }

        th, td { padding: 13px 14px; text-align: left; border-bottom: 1px solid var(--border); }

        th {
            background: rgba(245,166,35,0.08);
            color: var(--yellow-main);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8em;
            letter-spacing: 0.6px;
        }

        tr:hover { background: rgba(245,166,35,0.04); }

        td { color: #c8c8c8; }

        /* ── Buttons ──────────────────────────────────────────────────── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 18px;
            border-radius: var(--radius-btn);
            cursor: pointer;
            font-size: 0.88em;
            font-weight: 600;
            border: none;
            transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
            text-decoration: none;
        }

        .btn:disabled { opacity: 0.45; cursor: not-allowed; }

        .btn-primary {
            background: linear-gradient(135deg, var(--yellow-main) 0%, var(--yellow-bright) 100%);
            color: #000;
            box-shadow: var(--shadow-btn);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245,166,35,0.5);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: #fff;
            box-shadow: 0 4px 12px rgba(239,68,68,0.3);
        }

        .btn-danger:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(239,68,68,0.45);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--green) 0%, #059669 100%);
            color: #fff;
            box-shadow: 0 4px 12px rgba(16,185,129,0.3);
        }

        .btn-success:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(16,185,129,0.45);
        }

        .btn-ghost {
            background: rgba(255,255,255,0.06);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-ghost:hover:not(:disabled) {
            background: rgba(255,255,255,0.10);
            color: var(--text-primary);
        }

        /* ── Badges ───────────────────────────────────────────────────── */
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: var(--radius-badge);
            font-size: 0.72em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-auto   { background: linear-gradient(135deg, var(--green) 0%, #059669 100%); color:#fff; }
        .badge-human  { background: linear-gradient(135deg, var(--amber) 0%, #d97706 100%); color:#fff; }
        .badge-block  { background: linear-gradient(135deg, var(--red)   0%, #dc2626 100%); color:#fff; }
        .badge-allow  { background: linear-gradient(135deg, var(--green) 0%, #059669 100%); color:#fff; }

        /* ── Info / state text ────────────────────────────────────────── */
        .info-text    { color: var(--text-secondary); margin-bottom: 14px; line-height: 1.6; }
        .info-text strong { color: var(--text-primary); }
        .success-text { color: var(--green);  font-weight: 600; }
        .warning-text { color: var(--amber);  font-weight: 600; }
        .error-text   { color: var(--red);    font-weight: 600; }

        .loading { text-align: center; padding: 36px; color: var(--text-muted); }

        /* ── Toast notifications ──────────────────────────────────────── */
        #toast-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 0.9em;
            font-weight: 600;
            max-width: 360px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            animation: toast-in 0.25s ease forwards;
            pointer-events: auto;
            border-left: 4px solid transparent;
        }

        .toast-ok {
            background: #0f2a1a;
            color: var(--green);
            border-color: var(--green);
        }

        .toast-err {
            background: #2a0f0f;
            color: var(--red);
            border-color: var(--red);
        }

        .toast-info {
            background: #1a1500;
            color: var(--yellow-main);
            border-color: var(--yellow-main);
        }

        @keyframes toast-in {
            from { opacity: 0; transform: translateX(30px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        @keyframes toast-out {
            from { opacity: 1; transform: translateX(0); }
            to   { opacity: 0; transform: translateX(30px); }
        }

        /* ── Chart container ──────────────────────────────────────────── */
        .chart-container { position: relative; height: 300px; margin-top: 18px; }

        /* ── Workflow visual ──────────────────────────────────────────── */
        .workflow-visual {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin: 18px 0;
        }

        .workflow-step {
            padding: 22px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid;
            transition: transform 0.2s;
        }

        .workflow-step:hover { transform: translateY(-4px); }

        .workflow-auto  { background: rgba(16,185,129,0.08);  border-color: var(--green); }
        .workflow-human { background: rgba(245,158,11,0.08);  border-color: var(--amber); }

        .workflow-step .icon { font-size: 2.2em; margin-bottom: 10px; }
        .workflow-step h3    { font-size: 1.1em; margin-bottom: 10px; color:#fff; font-weight:700; }
        .workflow-step p     { font-size: 0.85em; margin: 6px 0; color: var(--text-secondary); }
        .workflow-step p strong { color:#fff; }

        .percentile-label {
            font-size: 0.73em;
            color: var(--text-muted);
            display: block;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .auto-indicator { font-size: 1.2em; margin-right: 5px; }

        /* ── Log output box (Import tab) ──────────────────────────────── */
        .log-box {
            background: #050505;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
            font-size: 0.8em;
            color: #88cc44;
            max-height: 340px;
            overflow-y: auto;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .log-box .log-err { color: var(--red); }

        /* ── Upload zone ──────────────────────────────────────────────── */
        .upload-zone {
            border: 2px dashed var(--border-accent);
            border-radius: 14px;
            padding: 48px 24px;
            text-align: center;
            background: rgba(245,166,35,0.03);
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .upload-zone:hover, .upload-zone.drag-over {
            background: rgba(245,166,35,0.08);
            border-color: var(--yellow-bright);
        }

        .upload-zone input[type=file] {
            display: none;
        }

        .upload-icon { font-size: 3em; margin-bottom: 14px; }

        .upload-zone h3 { font-size: 1.1em; color: var(--text-primary); margin-bottom: 8px; }
        .upload-zone p  { font-size: 0.88em; color: var(--text-secondary); margin-bottom: 20px; }

        /* ── Queue items ──────────────────────────────────────────────── */
        .queue-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 10px;
            background: rgba(245,158,11,0.04);
            transition: background 0.2s, border-color 0.2s;
        }

        .queue-item:hover {
            background: rgba(245,158,11,0.09);
            border-color: var(--amber);
        }

        .queue-item.reviewed-block {
            background: rgba(239,68,68,0.05);
            border-color: rgba(239,68,68,0.3);
            opacity: 0.72;
        }

        .queue-item.reviewed-allow {
            background: rgba(16,185,129,0.05);
            border-color: rgba(16,185,129,0.3);
            opacity: 0.72;
        }

        .queue-ip    { font-weight: 700; color: var(--text-primary); flex: 1; }
        .queue-port  { color: var(--text-secondary); font-size: 0.88em; min-width: 80px; }
        .queue-score { min-width: 100px; text-align: right; }
        .queue-actions { display: flex; gap: 8px; }

        /* ── Summary tiles ────────────────────────────────────────────── */
        .summary-tiles {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 14px;
            margin-top: 18px;
        }

        .summary-tile {
            background: rgba(245,166,35,0.06);
            border: 1px solid rgba(245,166,35,0.2);
            border-radius: 12px;
            padding: 18px 14px;
            text-align: center;
        }

        .summary-tile .tile-val {
            font-size: 2em;
            font-weight: 800;
            color: var(--yellow-bright);
            display: block;
        }

        .summary-tile .tile-lbl {
            font-size: 0.78em;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        /* ── Section spacer ───────────────────────────────────────────── */
        .section-gap { margin-bottom: 24px; }
    </style>
</head>
<body>

<div class="page-wrap">
    <!-- ── Header ─────────────────────────────────────────────────── -->
    <div class="header">
        <div class="logo-container">
            <img src="/static/logo.png" alt="AdapTrap Logo">
        </div>
        <div class="header-content">
            <h1>
                <span class="brand">AdapTrap</span> Dashboard
                <span class="status-badge status-active" id="firewall-status">● ACTIVE</span>
            </h1>
            <p>Honeypot-Driven Continual Learning for Threat Detection and Firewall Rule Automation</p>
            <p class="timestamp" id="last-update">Last updated: —</p>
        </div>
    </div>

    <!-- ── Tab nav ────────────────────────────────────────────────── -->
    <nav class="tab-nav">
        <a href="/overview"       class="{{ 'active' if active_tab == 'overview' else '' }}">
            <span class="tab-icon">🛡️</span> Overview
        </a>
        <a href="/analyst-review" class="{{ 'active' if active_tab == 'analyst_review' else '' }}">
            <span class="tab-icon">👤</span> Analyst Review
        </a>
        <a href="/import-logs"    class="{{ 'active' if active_tab == 'import_logs' else '' }}">
            <span class="tab-icon">📥</span> Import Logs
        </a>
    </nav>

    <!-- ── Tab content ────────────────────────────────────────────── -->
    {% block content %}{% endblock %}
</div>

<!-- ── Toast container ────────────────────────────────────────────── -->
<div id="toast-container"></div>

<script>
// ── Global: live timestamp in header ──────────────────────────────
(async function pingStatus() {
    try {
        const s = await fetch('/api/status').then(r => r.json());
        const el = document.getElementById('last-update');
        if (el) el.textContent = 'Last updated: ' + new Date(s.timestamp).toLocaleString();
    } catch(e) {}
    setTimeout(pingStatus, 30000);
})();

// ── Toast utility ──────────────────────────────────────────────────
function showToast(message, type = 'ok') {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = 'toast toast-' + type;
    toast.textContent = message;
    container.appendChild(toast);
    setTimeout(() => {
        toast.style.animation = 'toast-out 0.25s ease forwards';
        setTimeout(() => toast.remove(), 280);
    }, 3800);
}
</script>

{% block scripts %}{% endblock %}
</body>
</html>
